[package]
name = "nucleoid"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Nucleoid core runtime (prototype)"
license = "Apache-2.0"

[lib]
name = "nucleoid"
path = "src/lib.rs"

[[bin]]
name = "nucleoid"
path = "src/main.rs"

[dependencies]
rquickjs = "0.12"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
