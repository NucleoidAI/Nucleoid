name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Publish nucleoid to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Prepare nuc package
        run: |
          sed -i '0,/^name = "nucleoid"$/s//name = "nuc"/' Cargo.toml
          sed -i '0,/^name = "nucleoid"$/s//name = "nuc"/' Cargo.lock
          grep -q '^name = "nuc"$' Cargo.toml
          cargo metadata --locked --no-deps > /dev/null

      - name: Publish nuc to crates.io
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
