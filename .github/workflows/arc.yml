name: ARC Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    defaults:
      run:
        shell: bash
        working-directory: arc
    env:
      ARC_CONCURRENCY: "5"
      ARC_PUZZLES: >-
        3aa6fb7a
        28bf18c6
        9af7a82c
        0ca9ddb6
        6150a2bd
        d631b094
        5582e5ca
        d037b0a7
        44f52bb0
        017c7c7b
        27a28665
        0d3d703e
        25d8a9c8
        25ff71a9
        3c9b0459
        74dd1130
        9565186b
        a85d4709
        ed36ccf7
        6e02f1e3
        794b24be
        e9afcf9a
        a9f96cdd
        8be77c9e
        c9e6f938
      NUCLEOID_EXECUTABLE: ${{ github.workspace }}/target/debug/nucleoid
      DOTENV_CONFIG_PATH: /dev/null
      NO_COLOR: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check OpenRouter secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ -z "${OPENROUTER_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::Set the OPENROUTER_API_KEY repository Actions secret before running this workflow."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build Nucleoid
        working-directory: ${{ github.workspace }}
        run: cargo build --locked --bin nucleoid

      - name: Install ARC dependencies
        run: bun --no-env-file install --frozen-lockfile

      - name: Run puzzles
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [[ ! "$ARC_CONCURRENCY" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::ARC_CONCURRENCY must be a positive integer."
            exit 1
          fi
          mkdir -p reports
          failed=0
          pids=()
          for puzzle_id in $ARC_PUZZLES; do
            (
              started_at=$SECONDS
              exit_code=0
              timeout --signal=TERM --kill-after=30s 30m bun --no-env-file run start "$puzzle_id" \
                > "reports/$puzzle_id.log" 2>&1 || exit_code=$?
              duration=$(( SECONDS - started_at ))
              printf '%s\t%s\n' "$exit_code" "$duration" > "reports/$puzzle_id.tsv"
              exit "$exit_code"
            ) &
            pids+=("$!")
            if [[ "${#pids[@]}" -ge "$ARC_CONCURRENCY" ]]; then
              for pid in "${pids[@]}"; do
                wait "$pid" || failed=1
              done
              pids=()
            fi
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || failed=1
          done
          for puzzle_id in $ARC_PUZZLES; do
            printf '::group::Puzzle %s\n' "$puzzle_id"
            cat "reports/$puzzle_id.log" || failed=1
            printf '::endgroup::\n'
          done
          exit "$failed"

      - name: Publish puzzle table
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          pass_count=0
          fail_count=0
          not_run_count=0
          {
            echo '## ARC Benchmark'
            echo
            echo 'PASS means an exact grid match. FAIL means a mismatch, error, or timeout. NOT RUN means no completed solver result was recorded.'
            echo
            echo 'Solver logs and exit records are available in the arc-benchmark artifact.'
            echo
            echo '| Puzzle | Result | Exit code | Seconds |'
            echo '| --- | --- | --- | --- |'
            for puzzle_id in $ARC_PUZZLES; do
              if [[ -f "arc/reports/$puzzle_id.tsv" ]]; then
                IFS=$'\t' read -r exit_code duration < "arc/reports/$puzzle_id.tsv"
                if [[ "$exit_code" -eq 0 ]]; then
                  result=PASS
                  pass_count=$(( pass_count + 1 ))
                else
                  result=FAIL
                  fail_count=$(( fail_count + 1 ))
                fi
                printf '| `%s` | %s | %s | %s |\n' "$puzzle_id" "$result" "$exit_code" "$duration"
              else
                not_run_count=$(( not_run_count + 1 ))
                printf '| `%s` | NOT RUN | - | - |\n' "$puzzle_id"
              fi
            done
            echo
            echo '### Summary'
            echo
            echo '| PASS | FAIL | NOT RUN | Total |'
            echo '| --- | --- | --- | --- |'
            printf '| %s | %s | %s | %s |\n' "$pass_count" "$fail_count" "$not_run_count" "$(( pass_count + fail_count + not_run_count ))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload solver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-benchmark
          path: arc/reports/
          if-no-files-found: ignore
          retention-days: 7
